$kind: http-request
name: Iniciar sesión como Carlos
method: POST
url: '{{base_url}}/login'
order: 2000
headers:
    - key: Content-Type
      value: application/json
    - key: X-XSRF-TOKEN
      value: '{{xsrf_token}}'
body:
    type: json
    content: |-
        {
          "email": "{{carlos_email}}",
          "password": "{{demo_password}}"
        }
scripts:
    - type: afterResponse
      language: text/javascript
      code: |-
          pm.test('Login válido responde 200', () => pm.response.to.have.status(200));
          pm.test('La respuesta no expone contraseñas', () => {
            pm.expect(pm.response.text()).not.to.include('password');
          });
