$kind: http-request
name: Rechazar login sin encabezado CSRF
method: POST
url: '{{base_url}}/login'
order: 8000
headers:
    - key: Content-Type
      value: application/json
body:
    type: json
    content: |-
        {
          "email": "{{carlos_email}}",
          "password": "{{demo_password}}"
        }
scripts:
    - type: afterResponse
      language: text/javascript
      code: |-
          pm.test('Login sin X-XSRF-TOKEN responde 419', () => {
            pm.response.to.have.status(419);
          });
