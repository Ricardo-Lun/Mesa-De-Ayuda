$kind: http-request
name: Rechazar credenciales inválidas
method: POST
url: '{{base_url}}/login'
order: 4000
headers:
    - key: Content-Type
      value: application/json
    - key: X-XSRF-TOKEN
      value: '{{xsrf_token}}'
body:
    type: json
    content: |-
        {
          "email": "nobody@example.com",
          "password": "incorrect-password"
        }
scripts:
    - type: afterResponse
      language: text/javascript
      code: |-
          pm.test('Fortify devuelve 422 para credenciales inválidas', () => {
            pm.response.to.have.status(422);
          });
