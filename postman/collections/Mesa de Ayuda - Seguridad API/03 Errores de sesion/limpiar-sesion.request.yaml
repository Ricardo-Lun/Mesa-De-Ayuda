$kind: http-request
name: Limpiar cualquier sesión residual
method: POST
url: '{{base_url}}/logout'
order: 7000
headers:
    - key: X-XSRF-TOKEN
      value: '{{xsrf_token}}'
scripts:
    - type: beforeRequest
      language: text/javascript
      code: |-
          const currentXsrfCookie = pm.cookies.get('XSRF-TOKEN');
          if (currentXsrfCookie) {
            const currentXsrfToken = decodeURIComponent(currentXsrfCookie);
            pm.environment.set('xsrf_token', currentXsrfToken);
            pm.request.headers.upsert({ key: 'X-XSRF-TOKEN', value: currentXsrfToken });
          }
    - type: afterResponse
      language: text/javascript
      code: |-
          pm.test('La sesión queda limpia para la siguiente carpeta', () => {
            pm.expect(pm.response.code).to.be.oneOf([204, 401]);
          });
